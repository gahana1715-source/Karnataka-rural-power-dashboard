<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karnataka Rural Power Outage &amp; Grid Reliability Dashboard (2000–2026)</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS & RESET (Zero External Dependencies)
       ========================================================================== */
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-header: #0f172a;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;

      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-blue-soft: #eff6ff;

      --status-active-bg: #fef2f2;
      --status-active-text: #dc2626;
      --status-active-border: #fecaca;

      --status-dispatched-bg: #fffbeb;
      --status-dispatched-text: #d97706;
      --status-dispatched-border: #fde68a;

      --status-resolved-bg: #ecfdf5;
      --status-resolved-text: #059669;
      --status-resolved-border: #a7f3d0;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 18px 36px rgba(15, 23, 42, 0.18);
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ==========================================================================
       TOP NAVIGATION HEADER
       ========================================================================== */
    .top-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 1.15rem 1.5rem;
      border-bottom: 1px solid #334155;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .header-title-group h1 {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .header-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.15rem;
    }

    .header-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .live-badge.scada-connected {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(96, 165, 250, 0.55);
      color: #93c5fd;
    }

    .live-badge.scada-error {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(248, 113, 113, 0.55);
      color: #fca5a5;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseRing 2s infinite;
    }

    .live-badge.scada-connected .pulse-dot {
      background-color: #3b82f6;
    }

    .live-badge.scada-error .pulse-dot {
      background-color: #ef4444;
      animation: none;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.55rem 0.98rem;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.12s ease;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .btn-header-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: var(--radius-md);
      padding: 0.52rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-header-outline:hover {
      background: #334155;
      border-color: #64748b;
      color: #ffffff;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.52rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: #94a3b8;
    }

    /* ==========================================================================
       MAIN CONTAINER & DATA SOURCE / SCADA BANNER
       ========================================================================== */
    .main-container {
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 1.35rem 1.5rem 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .telemetry-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 0.9rem 1.15rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .telemetry-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
    }

    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .source-pill.db-imported {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .source-pill.scada-live {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .telemetry-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    /* ==========================================================================
       FILTER BAR
       ========================================================================== */
    .filter-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.05rem 1.2rem;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 0.9rem;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .filter-group label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .filter-control {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 0.86rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .filter-control:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .filter-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .active-filter-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 0.95rem;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      color: #0369a1;
    }

    /* ==========================================================================
       KPI SUMMARY CARDS
       ========================================================================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.65rem;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .kpi-card.blue::before { background: #2563eb; }
    .kpi-card.red::before { background: #dc2626; }
    .kpi-card.amber::before { background: #d97706; }
    .kpi-card.emerald::before { background: #059669; }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .kpi-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .kpi-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .kpi-meta {
      font-size: 0.77rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ==========================================================================
       HOTSPOT FEEDER CARDS
       ========================================================================== */
    .hotspot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.15rem;
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-sub {
      font-size: 0.79rem;
      color: var(--text-muted);
    }

    .district-badge {
      font-size: 0.73rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      border: 1px solid #bfdbfe;
    }

    .village-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.48rem;
    }

    .village-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.42rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 0.79rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .village-chip:hover {
      border-color: var(--accent-blue);
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .village-chip.selected {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    .chip-count {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.42rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
    }

    .village-chip.selected .chip-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* ==========================================================================
       ANALYTICS & SVG CHARTS SECTION
       ========================================================================== */
    .charts-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1.15rem;
    }

    @media (max-width: 960px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      font-size: 0.77rem;
      color: var(--text-secondary);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      font-weight: 600;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }

    .svg-chart-wrap {
      width: 100%;
      overflow: hidden;
    }

    .cause-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 0.2rem;
    }

    .cause-item {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .cause-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cause-stats {
      font-size: 0.77rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* ==========================================================================
       LIVE INCIDENT TABLE
       ========================================================================== */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
      font-size: 0.84rem;
    }

    thead th {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: left;
      padding: 0.78rem 0.9rem;
      border-bottom: 1px solid var(--border-color);
    }

    tbody td {
      padding: 0.8rem 0.9rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.24rem 0.65rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .status-Active {
      background: var(--status-active-bg);
      color: var(--status-active-text);
      border-color: var(--status-active-border);
    }

    .status-Dispatched {
      background: var(--status-dispatched-bg);
      color: var(--status-dispatched-text);
      border-color: var(--status-dispatched-border);
    }

    .status-Resolved {
      background: var(--status-resolved-bg);
      color: var(--status-resolved-text);
      border-color: var(--status-resolved-border);
    }

    .severity-tag {
      font-size: 0.73rem;
      font-weight: 700;
      padding: 0.16rem 0.5rem;
      border-radius: 6px;
    }

    .sev-Critical { background: #fee2e2; color: #b91c1c; }
    .sev-High { background: #ffedd5; color: #c2410c; }
    .sev-Moderate { background: #e0f2fe; color: #0369a1; }

    .origin-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.12rem 0.42rem;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      display: inline-block;
      margin-top: 2px;
    }

    .origin-tag.scada {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .origin-tag.csv {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .action-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .btn-sm {
      padding: 0.34rem 0.65rem;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-dispatch {
      background: #fffbeb;
      color: #b45309;
      border-color: #fcd34d;
    }

    .btn-dispatch:hover {
      background: #fef3c7;
    }

    .btn-resolve {
      background: #ecfdf5;
      color: #047857;
      border-color: #6ee7b7;
    }

    .btn-resolve:hover {
      background: #d1fae5;
    }

    .resolved-note {
      font-size: 0.76rem;
      color: #059669;
      font-weight: 600;
    }

    /* ==========================================================================
       MODAL DIALOGS (+ LOG NEW OUTAGE, DATABASE IMPORT, LIVE SCADA)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 60;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 580px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      animation: modalPop 0.18s ease-out;
      margin: auto;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 1.05rem 1.25rem;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 1.02rem;
      font-weight:
